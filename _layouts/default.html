{%- assign p = site.data.profile -%}
{%- assign v = site.time | date: '%s' -%}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f14">
  {% seo %}
  <link rel="icon" href="{{ '/assets/img/logo.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ '/assets/img/thumbnail.ico' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ v }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ v }}"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{ p.name | jsonify }},
    "jobTitle": {{ p.role | jsonify }},
    "worksFor": { "@type": "Organization", "name": {{ p.company | jsonify }} },
    "address": { "@type": "PostalAddress", "addressLocality": "Bogotá", "addressCountry": "CO" },
    "url": {{ site.url | jsonify }},
    "image": {{ '/assets/img/breitner-gonzalez.jpg' | absolute_url | jsonify }},
    "sameAs": {{ site.social.links | jsonify }},
    "knowsAbout": {{ p.expertise | jsonify }},
    "alumniOf": [
      {%- for e in p.education -%}
      { "@type": "CollegeOrUniversity", "name": {{ e.school | jsonify }} }{% unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ]
  }
  </script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  {{ content }}
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ v }}" defer></script>
</body>
</html>
